apiVersion: v1
tool:
  name: ffmpeg__healthz
  description: |-
    /**
     * Check whether ffmpeg runtime dependency is available.
     * @remarks Returns ffmpeg version and health status as JSON.
     */
  input:
    properties: {}
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  timeoutMs: 10000
  maxOutputBytes: 65536
  script:
    path: ./scripts/ffmpeg__healthz.sh
    interpreter: bash
