apiVersion: v1
tool:
  name: host_info__healthz
  description: |-
    /**
     * Check whether host_info bundle can access basic host context commands.
     * @remarks Verifies uname availability and emits a compact JSON report.
     */
  input:
    properties: {}
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  timeoutMs: 10000
  maxOutputBytes: 65536
  script:
    path: ./scripts/host_info__healthz.sh
    interpreter: bash
