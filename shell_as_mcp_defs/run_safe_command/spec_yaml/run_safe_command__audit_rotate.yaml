apiVersion: v1
tool:
  name: run_safe_command__audit_rotate
  description: |-
    /**
     * Rotate run_safe_command audit file immediately and enforce retention.
     */
  input:
    properties:
      max_files:
        type: number
        description: Optional retention count for rotated files. Range 1-100.
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  env:
    fromParams:
      TOOL_MAX_FILES: max_files
  timeoutMs: 10000
  maxOutputBytes: 131072
  script:
    path: ./scripts/run_safe_command__audit_rotate.sh
    interpreter: bash
