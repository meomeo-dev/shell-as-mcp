apiVersion: v1
tool:
  name: ytdlp__healthz
  description: |-
    /**
     * Check whether ytdlp bundle runtime dependency is available.
     * @remarks Verifies yt-dlp command presence and returns version in JSON.
     */
  input:
    properties: {}
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  timeoutMs: 10000
  maxOutputBytes: 65536
  script:
    path: ./scripts/ytdlp__healthz.sh
    interpreter: bash
