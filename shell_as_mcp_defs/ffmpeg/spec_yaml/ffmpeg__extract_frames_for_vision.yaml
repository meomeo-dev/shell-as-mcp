apiVersion: v1
tool:
  name: ffmpeg__extract_frames_for_vision
  description: |-
    /**
     * Extract image frames for multimodal vision prompts.
     * @remarks Returns JSON in stdout with frame_paths and frame_count for direct LLM/prompt ingestion.
     * @param input_path Source video path.
      * @param output_dir Optional output directory. Falls back to FFMPEG_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR.
     * @param start_time Optional start timestamp.
     * @param end_time Optional end timestamp.
     * @param fps Optional extraction fps (for example 0.5 for one frame every two seconds).
     * @param keyframes_only Whether to extract only keyframes (I-frames).
     * @param max_resolution Optional longest-edge cap for generated frames.
     */
  input:
    properties:
      input_path:
        type: string
        description: Source video path.
      output_dir:
        type: string
        description: Optional output directory. Falls back to FFMPEG_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR.
      start_time:
        type: string
        description: Optional start timestamp.
      end_time:
        type: string
        description: Optional end timestamp.
      fps:
        type: number
        description: Optional extraction fps.
      keyframes_only:
        type: boolean
        description: Whether to extract only keyframes.
      max_resolution:
        type: integer
        description: Optional longest-edge cap for generated frames.
    required: [input_path]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  env:
    static:
      FFMPEG_HIDE_BANNER: "1"
      FFMPEG_LOG_LEVEL: "error"
    fromRuntime:
      TOOL_OUTPUT_DIR: [FFMPEG_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR]
    fromParams:
      INPUT_PATH: input_path
      TOOL_OUTPUT_DIR: output_dir
      START_TIME: start_time
      END_TIME: end_time
      FPS: fps
      KEYFRAMES_ONLY: keyframes_only
      MAX_RESOLUTION: max_resolution
  timeoutMs: 300000
  taskMode: async
  maxOutputBytes: 1048576
  script:
    path: ./scripts/ffmpeg__extract_frames_for_vision.sh
    interpreter: bash