apiVersion: v1
tool:
  name: iwencai__query2data_basic
  description: |-
    /**
     * Run a bounded iwencai query2data request for read-only natural language market queries.
     * @remarks Requires IWENCAI_API_KEY to already be configured in the runtime environment. Disallows output-file writes and multi-page expansion.
     * @param query Natural language query text passed to iwencai query2data.
     * @param limit Maximum number of rows to request, capped at 50. Default 20.
     * @param page Result page number, capped at 100. Default 1.
     * @param format Structured output format: json or jsonl. Default json.
     */
  input:
    properties:
      query:
        type: string
        description: "Natural language query text passed to iwencai query2data."
      limit:
        type: integer
        description: "Maximum number of rows to request, capped at 50. Default 20."
      page:
        type: integer
        description: "Result page number, capped at 100. Default 1."
      format:
        type: string
        description: "Structured output format: json or jsonl. Default json."
    required: [query]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS for non-interactive CLI help and wrapper execution path.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
  env:
    fromParams:
      TOOL_QUERY: query
      TOOL_LIMIT: limit
      TOOL_PAGE: page
      TOOL_FORMAT: format
    fromRuntime:
      TOOL_IWENCAI_API_KEY: IWENCAI_API_KEY
  timeoutMs: 30000
  maxOutputBytes: 262144
  script:
    path: ./scripts/iwencai__query2data_basic.sh
    interpreter: bash
