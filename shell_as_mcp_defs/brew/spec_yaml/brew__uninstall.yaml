apiVersion: v1
tool:
  name: brew__uninstall
  description: |-
    /**
     * Uninstall a Homebrew formula or cask. Requires explicit user authorization.
     * @remarks Two-layer authorization: (1) confirm_action must be true, (2) macOS displays a native authorization dialog the user must approve. Use force=true only when standard uninstall fails.
     * @param package_name Name of the formula or cask to uninstall.
     * @param cask Whether the package is a cask. Default false.
     * @param force Whether to pass --force to brew uninstall. Default false.
     * @param confirm_action Must be set to true to authorize this uninstallation.
     */
  input:
    properties:
      package_name:
        type: string
        description: "Name of the Homebrew formula or cask to uninstall."
      cask:
        type: boolean
        description: "Set to true if uninstalling a cask. Default false."
      force:
        type: boolean
        description: "Pass --force to brew uninstall. Default false."
      confirm_action:
        type: boolean
        description: "REQUIRED: must be true to authorize uninstallation. Set only after user explicitly confirms."
    required: [package_name, confirm_action]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    fromParams:
      TOOL_PACKAGE_NAME: package_name
      TOOL_CASK: cask
      TOOL_FORCE: force
      TOOL_CONFIRM_ACTION: confirm_action
  timeoutMs: 120000
  maxOutputBytes: 1048576
  script:
    path: ./scripts/brew__uninstall.sh
    interpreter: bash
