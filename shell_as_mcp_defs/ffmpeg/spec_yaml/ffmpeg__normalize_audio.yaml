apiVersion: v1
tool:
  name: ffmpeg__normalize_audio
  description: |-
    /**
     * Normalize audio loudness to a target EBU R128 LUFS using the ffmpeg loudnorm filter.
     * @remarks Returns JSON in stdout with output_path and applied normalization parameters. Default target of -14 LUFS is suitable for most streaming platforms (YouTube, Spotify).
     * @param input_path Source audio or video path.
     * @param output_path Destination audio path.
     * @param target_lufs Target integrated loudness in LUFS. Default -14.
     * @param true_peak Maximum true peak level in dBTP. Default -1.0.
     * @param loudness_range Target loudness range (LRA) in LU. Default 11.
     */
  input:
    properties:
      input_path:
        type: string
        description: Source audio or video path.
      output_path:
        type: string
        description: Destination normalized audio path.
      target_lufs:
        type: number
        description: Target integrated loudness in LUFS. Default -14 (suitable for YouTube and most streaming platforms).
      true_peak:
        type: number
        description: Maximum true peak level in dBTP. Default -1.0.
      loudness_range:
        type: number
        description: Target loudness range (LRA) in LU. Default 11.
    required: [input_path, output_path]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  env:
    static:
      FFMPEG_HIDE_BANNER: "1"
      FFMPEG_LOG_LEVEL: "error"
    fromParams:
      INPUT_PATH: input_path
      OUTPUT_PATH: output_path
      TARGET_LUFS: target_lufs
      TRUE_PEAK: true_peak
      LOUDNESS_RANGE: loudness_range
  timeoutMs: 300000
  taskMode: async
  maxOutputBytes: 1048576
  script:
    path: ./scripts/ffmpeg__normalize_audio.sh
    interpreter: bash