apiVersion: v1
tool:
  name: ass__smoke_test
  description: |-
    /**
     * Render a short test video from an ASS subtitle file to verify renderability.
     * @remarks Uses ffmpeg lavfi virtual color source to generate a background, then
     *   overlays the ASS subtitles via the subtitles filter (requires libass support in ffmpeg).
     *   Outputs a JSON summary on success or an error payload on failure.
     * @param ass_file_path Path to the ASS subtitle file to render.
     * @param output_path Path for the output MP4 video file.
    * @param output_dir Optional output directory fallback for relative output_path. Falls back to ASS_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR.
     * @param duration_sec Duration of the test video in seconds (1-300). Default: 10.
     * @param resolution Output video resolution in WxH format. Default: 1920x1080.
     * @param background_color Background color for the test video (ffmpeg color name or hex). Default: black.
     */
  input:
    properties:
      ass_file_path:
        type: string
        description: "Path to the ASS subtitle file to render."
      output_path:
        type: string
        description: "Path for the output MP4 video file."
      output_dir:
        type: string
        description: "Optional output directory fallback for relative output_path. Falls back to ASS_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR."
      duration_sec:
        type: integer
        description: "Duration of the test video in seconds (1-300). Default: 10."
      resolution:
        type: string
        description: "Output video resolution in WxH format (e.g. 1920x1080). Default: 1920x1080."
      background_color:
        type: string
        description: "Background color for the test video (ffmpeg color name or hex, e.g. black). Default: black."
    required: [ass_file_path, output_path]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    fromRuntime:
      TOOL_OUTPUT_DIR: [ASS_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR]
    fromParams:
      TOOL_ASS_FILE_PATH: ass_file_path
      TOOL_OUTPUT_PATH: output_path
      TOOL_OUTPUT_DIR: output_dir
      TOOL_DURATION_SEC: duration_sec
      TOOL_RESOLUTION: resolution
      TOOL_BACKGROUND_COLOR: background_color
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  timeoutMs: 120000
  taskMode: async
  script:
    path: ./scripts/ass__smoke_test.sh
    interpreter: bash
