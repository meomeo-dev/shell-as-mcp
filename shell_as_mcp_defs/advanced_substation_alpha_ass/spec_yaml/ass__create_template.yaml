apiVersion: v1
tool:
  name: ass__create_template
  description: |-
    /**
     * Create a new ASS subtitle template file with Default, Title, and Note styles.
     * @remarks Writes a valid ASS v4.00+ file with pre-configured styles for general subtitles,
     * title overlays, and note text. Fails if the output file already exists unless overwrite=true.
     * @param output_path Destination path for the generated .ass file.
    * @param output_dir Optional output directory fallback for relative output_path. Falls back to ASS_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR.
     * @param title Script title embedded in [Script Info] section. Default: "Untitled".
     * @param play_res_x Virtual canvas width in pixels. Default: 1920.
     * @param play_res_y Virtual canvas height in pixels. Default: 1080.
     * @param overwrite If true, overwrite the file when it already exists. Default: false.
     */
  input:
    properties:
      output_path:
        type: string
        description: "Destination path for the generated .ass file."
      output_dir:
        type: string
        description: "Optional output directory fallback for relative output_path. Falls back to ASS_OUTPUT_DIR or SHELL_AS_MCP_OUTPUT_DIR."
      title:
        type: string
        description: "Script title embedded in [Script Info] section. Default: Untitled."
      play_res_x:
        type: integer
        description: "Virtual canvas width in pixels. Default: 1920."
      play_res_y:
        type: integer
        description: "Virtual canvas height in pixels. Default: 1080."
      overwrite:
        type: boolean
        description: "If true, overwrite the file when it already exists. Default: false."
    required: [output_path]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    fromRuntime:
      TOOL_OUTPUT_DIR: [ASS_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR]
    fromParams:
      TOOL_OUTPUT_PATH: output_path
      TOOL_OUTPUT_DIR: output_dir
      TOOL_TITLE: title
      TOOL_PLAY_RES_X: play_res_x
      TOOL_PLAY_RES_Y: play_res_y
      TOOL_OVERWRITE: overwrite
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  timeoutMs: 10000
  script:
    path: ./scripts/ass__create_template.sh
    interpreter: bash
