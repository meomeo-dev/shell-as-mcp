apiVersion: v1
tool:
  name: shell__run_script_echo
  description: |-
    /**
     * Run a local script and echo the input value with prefix.
     * @param value Input value passed to the script.
     */
  input:
    properties:
      value:
        type: string
        description: Input value.
    required: [value]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    static:
      SCRIPT_PREFIX: yaml-script
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  timeoutMs: 10000
  maxOutputBytes: 1048576
  script:
    path: ./scripts/echo_script.sh
    interpreter: bash
    args:
      - "{{value}}"
