apiVersion: v1
tool:
  name: ffmpeg__concat_clips
  description: |-
    /**
     * Concatenate multiple video clips in sequence using the ffmpeg concat demuxer.
     * @remarks input_paths accepts a comma or newline-separated list of clip paths. Returns JSON in stdout with output_path and clip_count. Use reencode=true when clips have different codecs or parameters.
     * @param input_paths Comma or newline-separated list of clip file paths in playback order.
     * @param output_path Destination video path.
     * @param reencode Whether to re-encode during concat (required for clips with different codecs), default false.
     * @param video_codec Video codec when re-encoding, default libx264.
     * @param audio_codec Audio codec when re-encoding, default aac.
     */
  input:
    properties:
      input_paths:
        type: string
        description: Comma or newline-separated list of clip file paths in playback order.
      output_path:
        type: string
        description: Destination video path.
      reencode:
        type: boolean
        description: Whether to re-encode during concat (required for clips with different codecs). Default false.
      video_codec:
        type: string
        description: Video codec when re-encoding. Default libx264.
      audio_codec:
        type: string
        description: Audio codec when re-encoding. Default aac.
    required: [input_paths, output_path]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  env:
    static:
      FFMPEG_HIDE_BANNER: "1"
      FFMPEG_LOG_LEVEL: "error"
    fromParams:
      INPUT_PATHS: input_paths
      OUTPUT_PATH: output_path
      REENCODE: reencode
      VIDEO_CODEC: video_codec
      AUDIO_CODEC: audio_codec
  timeoutMs: 600000
  taskMode: async
  maxOutputBytes: 1048576
  script:
    path: ./scripts/ffmpeg__concat_clips.sh
    interpreter: bash
