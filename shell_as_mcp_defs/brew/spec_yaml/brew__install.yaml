apiVersion: v1
tool:
  name: brew__install
  description: |-
    /**
     * Install a Homebrew formula or cask. Requires explicit user authorization.
     * @remarks Two-layer authorization: (1) confirm_action must be true, (2) macOS displays a native authorization dialog the user must approve. Package name is validated against a safe character allowlist before execution.
     * @param package_name Name of the formula or cask to install.
     * @param cask Whether to install as a cask (GUI app). Default false.
     * @param confirm_action Must be set to true to authorize this installation. The calling AI agent is responsible for confirming user intent before setting this to true.
     */
  input:
    properties:
      package_name:
        type: string
        description: "Name of the Homebrew formula or cask to install."
      cask:
        type: boolean
        description: "Set to true to install a cask (GUI application). Default false."
      confirm_action:
        type: boolean
        description: "REQUIRED: must be true to authorize installation. Set only after user explicitly confirms."
    required: [package_name, confirm_action]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    fromParams:
      TOOL_PACKAGE_NAME: package_name
      TOOL_CASK: cask
      TOOL_CONFIRM_ACTION: confirm_action
  timeoutMs: 300000
  taskMode: async
  maxOutputBytes: 1048576
  script:
    path: ./scripts/brew__install.sh
    interpreter: bash
