apiVersion: v1
tool:
  name: shell__healthz
  description: |-
    /**
     * Check whether shell bundle basic runtime is available.
     * @remarks Verifies bash command presence and returns JSON status.
     */
  input:
    properties: {}
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  timeoutMs: 10000
  maxOutputBytes: 65536
  script:
    path: ./scripts/shell__healthz.sh
    interpreter: bash
