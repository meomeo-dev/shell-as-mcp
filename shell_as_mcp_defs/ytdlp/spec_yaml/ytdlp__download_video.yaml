apiVersion: v1
tool:
  name: ytdlp__download_video
  description: |-
    /**
      * Download a video from a URL using yt-dlp, saving to output_dir or a configured default directory.
     * @remarks Supports resolution selection and optional time-range trimming via --download-sections.
     *          Both startTime and endTime must be provided together to enable trimming.
     * @param url The video URL (must start with http:// or https://).
     * @param resolution Target resolution: "480p", "720p" (default), "1080p", or "best".
     * @param startTime Optional start time for clip extraction (e.g. "00:01:30").
     * @param endTime Optional end time for clip extraction (e.g. "00:05:00").
      * @param output_dir Optional output directory. Falls back to YTDLP_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR, or ~/Downloads.
      * @param cookies Optional path to a Netscape-format cookies file.
     * @param proxy Optional proxy address.
      * @param maxRetries Optional retry count after failures, capped at 2 (default: 2).
     */
  input:
    properties:
      url:
        type: string
        description: "The video URL (must start with http:// or https://)."
      resolution:
        type: string
        description: "Target resolution: 480p, 720p (default), 1080p, or best."
      startTime:
        type: string
        description: "Optional clip start time in HH:MM:SS format (e.g. \"00:01:30\"). Requires endTime."
      endTime:
        type: string
        description: "Optional clip end time in HH:MM:SS format (e.g. \"00:05:00\"). Requires startTime."
      output_dir:
        type: string
        description: "Optional output directory. Falls back to YTDLP_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR, or ~/Downloads."
      cookies:
        type: string
        description: "Optional path to a Netscape-format cookies file."
      proxy:
        type: string
        description: "Optional proxy address (e.g. socks5://127.0.0.1:1080)."
      maxRetries:
        type: number
        description: "Optional retry count after failures. Max supported value is 2."
    required: [url]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  env:
    fromRuntime:
      TOOL_OUTPUT_DIR: [YTDLP_OUTPUT_DIR, SHELL_AS_MCP_OUTPUT_DIR]
    fromParams:
      TOOL_URL: url
      TOOL_RESOLUTION: resolution
      TOOL_START_TIME: startTime
      TOOL_END_TIME: endTime
      TOOL_OUTPUT_DIR: output_dir
      TOOL_COOKIES: cookies
      TOOL_PROXY: proxy
      TOOL_MAX_RETRIES: maxRetries
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
      - os: linux
        kernel: linux
        arch: x86_64
        support: declared
        notes: Declared for Linux x86_64; not validated in-repo.
      - os: linux
        kernel: linux
        arch: arm64
        support: declared
        notes: Declared for Linux arm64; not validated in-repo.
  timeoutMs: 3600000
  taskMode: async
  maxOutputBytes: 524288
  script:
    path: ./scripts/ytdlp__download_video.sh
    interpreter: bash
