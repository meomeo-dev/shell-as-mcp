apiVersion: v1
tool:
  name: runprompt__healthz
  description: |-
    /**
     * Check whether runprompt bundle runtime prerequisites are available.
     * @remarks Verifies python3 availability and returns version in JSON.
     */
  input:
    properties: {}
    required: []
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  timeoutMs: 10000
  maxOutputBytes: 65536
  script:
    path: ./scripts/runprompt__healthz.sh
    interpreter: bash
