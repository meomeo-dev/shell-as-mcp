apiVersion: v1
tool:
  name: iwencai__search_basic
  description: |-
    /**
     * Run a bounded iwencai search request across supported content channels.
     * @remarks Requires IWENCAI_API_KEY to already be configured in the runtime environment. Disallows output-file writes and unsupported channels.
     * @param query Search keywords passed to iwencai search.
     * @param channel Search channel: announcement, investor, news, or report.
     * @param limit Maximum number of rows to request, capped at 50. Default 20.
     * @param format Structured output format: json or jsonl. Default json.
     */
  input:
    properties:
      query:
        type: string
        description: "Search keywords passed to iwencai search."
      channel:
        type: string
        description: "Search channel: announcement, investor, news, or report."
      limit:
        type: integer
        description: "Maximum number of rows to request, capped at 50. Default 20."
      format:
        type: string
        description: "Structured output format: json or jsonl. Default json."
    required: [query, channel]
  output:
    type: object
    properties:
      status: { type: string }
      exit_code: { type: number }
      stdout: { type: string }
      stderr: { type: string }
      command: { type: string }
      execution_time_ms: { type: number }
execution:
  shell:
    mode: direct
  compatibility:
    targets:
      - os: macos
        kernel: darwin
        arch: arm64
        support: tested
        notes: Validated on Apple Silicon macOS for non-interactive CLI help and wrapper execution path.
      - os: macos
        kernel: darwin
        arch: x86_64
        support: declared
        notes: Declared for Intel macOS; not validated in-repo.
  env:
    fromParams:
      TOOL_QUERY: query
      TOOL_CHANNEL: channel
      TOOL_LIMIT: limit
      TOOL_FORMAT: format
    fromRuntime:
      TOOL_IWENCAI_API_KEY: IWENCAI_API_KEY
  timeoutMs: 30000
  maxOutputBytes: 262144
  script:
    path: ./scripts/iwencai__search_basic.sh
    interpreter: bash
